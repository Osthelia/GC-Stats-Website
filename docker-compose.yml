services:
  db:
    build:
      context: ./packages/db/docker/postgres
    container_name: db-v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gcstats_v2}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - cf-tunnel
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gcstats_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` applies packages/db/drizzle/*.sql.
  # Not started by `docker compose up` (no depends_on from web to migrate,
  # by design, migrations are a deliberate, explicit action).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    networks:
      - cf-tunnel
      - gcs_website-db
    profiles: ["tools"]

  # One-off: `docker compose run --rm -e V1_DATABASE_URL=mysql://root:password@host.docker.internal:3306/gc migrate-v1`
  # runs packages/db/scripts/migrate-v1/index.ts (full V1 -> V2 data migration,
  # MariaDB -> Postgres). V1_DATABASE_URL must point at the old V1 database
  # (host.docker.internal to reach a V1 DB running on the host from inside
  # the container). Not started by `docker compose up`, same rationale as
  # `migrate` above.
  migrate-v1:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["npx", "tsx", "scripts/migrate-v1/index.ts"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cf-tunnel
      - gcs_website-db
    profiles: ["tools"]

  # One-off: `docker compose run --rm migrate-storage [-- --dry-run] [-- --prefix=teams/]`
  # runs packages/storage/scripts/migrate-old-storage.ts (copies every object
  # from the old V1 storage, BunnyCDN Edge Storage, to the new S3-compatible
  # bucket, R2 in dev/prod). Needs both the OLD_S3_* vars (old storage) and the
  # existing S3_* vars (new storage, already in .env) — pure file transfer, no
  # DB access. Not started by `docker compose up`, same rationale as `migrate`
  # above.
  migrate-storage:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    working_dir: /repo/packages/storage
    command: ["npx", "tsx", "scripts/migrate-old-storage.ts"]
    env_file: .env
    networks:
      - cf-tunnel
    profiles: ["tools"]

  seed-db:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["npx", "tsx", "scripts/seed-admin-permissions.ts"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cf-tunnel
    profiles: ["tools"]

  seed-admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["npx", "tsx", "scripts/seed-admin-role.ts"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cf-tunnel
    profiles: ["tools"]

  # Dev only: a local S3-compatible bucket server (RustFS, a drop-in for the
  # archived MinIO) for logo/news uploads and LoL raw imports. Started only with
  # `docker compose --profile dev up -d`; plain `docker compose up` and prod
  # are unaffected. S3 API on localhost:9000, web console on localhost:9001
  # (log in with S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY).
  # Pin RUSTFS_IMAGE to a fixed tag if `latest` ever breaks.
  s3:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: s3-dev
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-gcsdevaccess}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-gcsdevsecretkey}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    ports:
      - "127.0.0.1:${S3_DEV_PORT:-9000}:9000"
      - "127.0.0.1:${S3_DEV_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles: ["dev"]

  # Dev only, one-off: creates S3_BUCKET and S3_LOL_IMPORTS_BUCKET on the dev
  # server. S3_BUCKET's objects are publicly readable (like the prod bucket
  # behind S3_PUBLIC_URL); S3_LOL_IMPORTS_BUCKET stays private, so its anonymous
  # access is set to none, which also undoes a public setting from an earlier run.
  # Uses RustFS's own CLI `rc`. Runs with `--profile dev up`, safe to re-run.
  # Pin RC_IMAGE like RUSTFS_IMAGE if needed.
  s3-init:
    image: ${RC_IMAGE:-rustfs/rc:latest}
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_KEY: ${S3_ACCESS_KEY_ID:-gcsdevaccess}
      S3_SECRET: ${S3_SECRET_ACCESS_KEY:-gcsdevsecretkey}
      PUBLIC_BUCKET: ${S3_BUCKET:-gcs-dev}
      PRIVATE_BUCKET: ${S3_LOL_IMPORTS_BUCKET:-gcs-lol-imports-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until rc alias set dev http://s3:9000 "$$S3_KEY" "$$S3_SECRET" > /dev/null; do echo "waiting for s3..."; sleep 1; done
        rc mb "dev/$$PUBLIC_BUCKET" --ignore-existing
        rc bucket anonymous set download "dev/$$PUBLIC_BUCKET"
        echo "bucket ready (public): $$PUBLIC_BUCKET"
        rc mb "dev/$$PRIVATE_BUCKET" --ignore-existing
        rc bucket anonymous set none "dev/$$PRIVATE_BUCKET"
        echo "bucket ready (private): $$PRIVATE_BUCKET"
    profiles: ["dev"]

volumes:
  db_data:
  s3_data:

networks:
  proxy:
    external: true
  cf-tunnel:
    external: true
  gcs_website-db:
    external: true